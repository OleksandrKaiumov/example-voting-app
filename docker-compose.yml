name: example-voting-app

services:
  vote:
    image: ${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER}/voting-app-vote:latest
    ports:
      - "5000:80"
    networks:
      - front-tier
      - back-tier
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  result:
    image: ${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER}/voting-app-result:latest
    ports:
      - "5001:80"
    networks:
      - front-tier
      - back-tier
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER}/voting-app-worker:latest
    networks:
      - back-tier
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    networks:
      - back-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
    external: true
    name: example-voting-app_db-data

networks:
  front-tier:
  back-tier:
