name: Build to ACR and Deploy to Azure VM

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acr-vm-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Vote Service
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/voting-app-vote"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" -t "$image:latest" ./vote
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Build and Push Result Service
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/voting-app-result"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" -t "$image:latest" ./result
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Build and Push Worker Service
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/voting-app-worker"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" -t "$image:latest" ./worker
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

  deploy-to-vm:
    name: Deploy with Docker Compose on Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USERNAME: ${{ secrets.VM_USERNAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare SSH key and verify VM host identity
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -T 15 -t ed25519 "$VM_HOST" > ~/.ssh/vm_known_hosts
          fingerprint=$(ssh-keygen -lf ~/.ssh/vm_known_hosts -E sha256 | awk '{print $2}')
          test "$fingerprint" = 'SHA256:yVYwmd8EdzTJZIHGq7Fi7GKxzyQpb4AJd7rsin6Db9A'
          cat > ~/.ssh/config <<EOF
          Host lab-vm
            HostName $VM_HOST
            User $VM_USERNAME
            IdentityFile ~/.ssh/vm_key
            UserKnownHostsFile ~/.ssh/vm_known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy docker-compose.yml to Azure VM via SCP
        run: |
          set -euo pipefail
          ssh lab-vm 'mkdir -p ~/voting-app-deploy'
          scp docker-compose.yml lab-vm:voting-app-deploy/docker-compose.yml

      - name: Deploy stack on Azure VM via SSH
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$ACR_LOGIN_SERVER" =~ ^[a-z0-9.-]+\.azurecr\.io$ ]]
          [[ "$ACR_USERNAME" =~ ^[a-zA-Z0-9_]+$ ]]
          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          cd ~/voting-app-deploy
          docker_config=$(mktemp -d)
          trap 'sudo rm -rf -- "$docker_config"' EXIT
          sudo docker --config "$docker_config" login "$1" \
            --username "$2" --password-stdin
          printf 'ACR_LOGIN_SERVER=%s\n' "$1" > .env
          sudo docker volume inspect example-voting-app_db-data > /dev/null
          sudo docker --config "$docker_config" compose pull
          for service in vote result worker; do
            image="$1/voting-app-$service:latest"
            revision=$(sudo docker image inspect "$image" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$revision" = "$3"
          done
          sudo docker compose up -d --no-build --remove-orphans \
            --wait --wait-timeout 180
          sudo docker compose ps
          REMOTE
          )
          printf -v quoted_script '%q' "$remote_script"
          printf '%s' "$ACR_PASSWORD" | ssh lab-vm \
            "bash -c $quoted_script -- '$ACR_LOGIN_SERVER' '$ACR_USERNAME' '$GITHUB_SHA'"

      - name: Remove temporary runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/vm_key ~/.ssh/vm_known_hosts ~/.ssh/config
